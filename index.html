
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYBE | Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101018;
      color: white;
      display: grid;
      place-items: center;
    }
    .container {
      width: min(90%, 750px);
      text-align: center;
      padding: 40px 20px;
    }
    h1 { font-size: 64px; color: #a78bfa; margin-bottom: 8px; }
    p { color: #c5c5d4; line-height: 1.6; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 35px;
    }
    .card {
      background: #1c1c29;
      padding: 30px 20px;
      border: 1px solid #373747;
      border-radius: 18px;
    }
    .card h2 { margin-top: 0; }
    a {
      display: inline-block;
      padding: 12px 25px;
      background: #8b5cf6;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
      margin-top: 15px;
    }
    a:hover { background: #7040df; }
    footer { margin-top: 35px; color: #88889a; font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>VYBE</h1>
    <p>Your entertainment. Your vibe.</p>
    <p>Discover stories, explore content, and enjoy your experience.</p>

    <div class="cards">
      <section class="card">
        <h2>Admin</h2>
        <p>Manage platform content and administration.</p>
        <a href="admin.html">Admin Login</a>
      </section>

      <section class="card">
        <h2>User</h2>
        <p>Sign in or create an account to explore VYBE.</p>
        <a href="user.html">User Login</a>
      </section>
    </div>

    <footer>© 2026 VYBE. All rights reserved.</footer>
  </main>
</body>
</html>
